_DESC":"A fight with boss strength in the middle of the map: more and tougher enemies than usual. It does not end the biome, that only happens with the boss at the top.","MAP_NODE_CAMP_DESC":"A place to rest: feed Monster Essence to the fire and it heals your monsters.","MAP_NODE_SHOP_DESC":"Spend your Monster Essence: element potions give a monster an additional element (so it can use more skills), trophies raise a stat for the rest of the run, relics give passive bonuses.","MAP_NODE_TRAINER_DESC":"Teaches your monsters rare skills, half of them with several elements. A monster can only use a skill if it has all of its elements, the pictures on each card show who fits. Without a free slot you replace an old skill. You only pay once the skill is learned.","MAP_NODE_JAILER_DESC":"The jailer keeps up to three monster species in chains. Every chain is a missing upgrade (+1 action per turn). Hand him a boss tear to break a chain, once the last one is gone the species is free and fully upgraded, permanently, also for future runs. Showing other prisoners costs Monster Essence.","MAP_NODE_EVENT_DESC":"A random event: a camp that heals your monsters, the wheel of fortune where you win or lose half of your Monster Essence, or the void that swaps a relic for another one of the same rarity.","MAP_NODE_TREASURE_DESC":"A chest full of Monster Essence, you need a key to open it.","MAP_NODE_GEM_DESC":"Pick one of three trophies. It raises one stat of a monster (e.g. attack or HP) for the rest of the run. The deeper you are, the stronger the trophies.","MAP_NODE_HUB":"OUTPOST","MAP_NODE_HUB_DESC":"The last stop of every path, right before the boss. Here you can rest (Monster Essence in the fire heals), visit the shop and the trainer, each once. Prepare your team for the boss fight!","CAMP_FIRE_ASK":"Feed me Monster Essence, and in return I'll credit it to you as health! 1 ME = {hp} HP for each monster.","CAMP_FIRE_EATING":"Omnomnom nom nom nomnom, yummy!","CAMP_FEED_POOR":"You don't have enough essence for that.","SKILL_REWARD_CHOOSE":"Choose a skill","SKILL_REWARD_HINT":"Drag a skill onto a monster to teach it. Only one!","SKILL_REWARD_SKIP":"Take no skill","SKILL_QUAKE_HAMMER":"Quake Hammer","SKILL_LANDSLIDE":"Landslide","SKILL_BEDROCK_WARD":"Bedrock Ward","SKILL_DEEP_ROOTS":"Deep Roots","SKILL_SUNFORGE_BLOW":"Sunforge Blow","SKILL_ASH_RAIN":"Ash Rain","SKILL_KILN_HIDE":"Kiln Hide","SKILL_HEARTH_SOUL":"Hearth Soul","SKILL_ABYSS_LANCE":"Abyss Lance","SKILL_RIPTIDE_WAVE":"Riptide Wave","SKILL_PEARL_WARD":"Pearl Ward","SKILL_WELLSPRING":"Wellspring","SKILL_SKY_RENDER":"Sky Render","SKILL_GALE_SWEEP":"Gale Sweep","SKILL_ZEPHYR_MANTLE":"Zephyr Mantle","SKILL_STORM_HEART":"Storm Heart","HUB_TITLE":"Outpost","HUB_DESC":"Last rest before the boss. Every station can be used once.","HUB_REST":"REST","HUB_DONE":"{station} (done)","HUB_CONTINUE":"Move on","MAP_HEADER_ROUTE":"Route:","EGG_OVERVIEW_TITLE":"Egg moves unlocked","EGG_OVERVIEW_UNLOCKED":"Unlocked","EGG_OVERVIEW_LOCKED":"Locked","EGG_DETAIL_ELEMENT":"Element: {element}","EGG_CATEGORY_PHYSICAL":"Physical","EGG_CATEGORY_MAGIC":"Magical","EGG_CATEGORY_SHIELD":"Shield","EGG_CATEGORY_BUFF":"Buff","EGG_CATEGORY_PASSIVE":"Passive","EGG_SOURCE_DEFAULT":"Unlocked (from the start)","EGG_SOURCE_DEFAULT_HINT":"Standard egg move: this species knows it from the start","EGG_SOURCE_SACRIFICE":"Unlocked (caught & sacrificed)","EGG_SOURCE_SACRIFICE_HINT":"Egg move: you caught this monster and sacrificed it","EGG_SOURCE_MILESTONE":"Unlocked (milestone)","EGG_SOURCE_BOUNTY":"Unlocked (bounty hunter)","MILESTONE_SOURCE_BOSS_1":"Milestone egg move: you defeated a biome boss with this monster as your starter","MILESTONE_SOURCE_BOSS_5":"Milestone egg move: you defeated 5 biome bosses with this monster as your starter","MILESTONE_SOURCE_GAME_WIN":"Milestone egg move: you finished the game with this monster as your starter","BOUNTY_SOURCE_ALPHA_1":"Bounty hunter: you defeated Alpha Gustmane with this monster (last hit)","BOUNTY_SOURCE_ALPHA_2":"Bounty hunter: you defeated Alpha Beaconclaw with this monster (last hit)","BOUNTY_SOURCE_NORTHERN_WARDEN":"Bounty hunter: you defeated the Northern Warden with this monster (last hit)","JAILER_TEAR_COUNT_ONE":"{amount} Boss Tear","JAILER_TEAR_COUNT_MANY":"{amount} Boss Tears","TREASURE_HINT":"Drag all the essence into the bag.","GEM_HINT":"Drag a trophy onto one of your monsters.","RELIC_REWARD_HINT":"Drag a relic into the bag.","BATTLE_CATCH_CALL_1":"Come...","BATTLE_CATCH_CALL_2":"Follow me...","MONSTER_INFO_BACK":"Back","TUTORIAL_TITLE":"How to play","TUTORIAL_SCROLL_HINT":"Scroll down for all explanations.","TUTORIAL_GOAL_TITLE":"The goal","TUTORIAL_GOAL":"Travel through five biomes all the way north. Every biome is a map full of fields, the biome boss waits at the top. Defeat the boss of the last biome and you win. If your whole team falls, the run is over.","TUTORIAL_START_TITLE":"The start","TUTORIAL_START":"Draw three eggs and pick one of them as your starter. Then choose three egg moves it takes into the run. Rotten eggs? With full charges you can reroll them.","TUTORIAL_RARITY_TITLE":"Rarity","TUTORIAL_RARITY":"The color of an egg shows the rarity of the species. Rarer monsters are stronger, but harder to catch.","TUTORIAL_MAP_TITLE":"The map","TUTORIAL_MAP":"Field by field you pick your way to the top. The legend on the map explains every field. Lost HP does not come back on its own: feed Monster Essence to a camp fire to heal.","TUTORIAL_BATTLE_TITLE":"Fighting","TUTORIAL_BATTLE":"The turn wheel shows the order, the fastest monster (speed) goes first. On your monster's turn, play its skill cards by dragging them onto a target. Every skill costs moves and has a cooldown afterwards. Above each enemy you see what it plans next, so shield up or strike first. End Turn passes to the next monster.","TUTORIAL_ELEMENTS_TITLE":"Elements","TUTORIAL_ELEMENTS":"There are four base elements: earth, fire, water and air. Combined they form mixed elements like ice, steam or magma. A monster can only use a skill if it has all of its elements. A good element match hits super effectively, a bad one is weaker. Element potions from the shop give a monster an additional element.","TUTORIAL_CATCH_TITLE":"Catching","TUTORIAL_CATCH":"Wild monsters can be caught with hypnosis. The spiral above an enemy shows your chance: the less HP it has left, the better. Below 10 % HP it gets easier, below 5 % even more. A high level and rarity make it harder.","TUTORIAL_TEAM_TITLE":"Your team","TUTORIAL_TEAM":"Your team holds at most two monsters. After a fight with catches you decide in the judgement: take a catch into the team (swapping out another one), let it pass a move on to your team, sacrifice it or release it. Whatever is left gets released. If one of your monsters has fallen, you can revive it once by giving up a new catch. New team members start with full HP.","TUTORIAL_EGG_MOVES_TITLE":"Egg moves","TUTORIAL_EGG_MOVES":"Egg moves are unlocked permanently for a species. There are three ways: catch a monster carrying an egg move and sacrifice it in the judgement, reach milestones with the species as your starter (e.g. defeat biome bosses), or claim bounties by defeating special alpha monsters with the last hit. After a boss fight the egg of one of your monsters may lie in the loot, from then on it can be your starter.","TUTORIAL_STRONGER_TITLE":"Getting stronger","TUTORIAL_STRONGER":"Fights give experience, your monsters level up. Trophies raise a stat for the rest of the run. The trainer and envelopes teach new skills (up to six per monster), element potions unlock more of them. At the jailer, boss tears break chains: each chain gives a species one more move per turn, permanently, in future runs too.","TUTORIAL_RELICS_TITLE":"Relics","TUTORIAL_RELICS":"Relics give passive bonuses for the whole run, for example a better catch chance. You get them from boxes after boss fights or in the shop, and the void swaps one for another of the same rarity. Your relics are shown at the top of the map, hover over them for details.","TUTORIAL_ESSENCE_TITLE":"Monster Essence","TUTORIAL_ESSENCE":"Monster Essence (ME) is the currency. You earn it in fights and treasures and spend it in the shop, at the trainer, at the camp fire (healing) or on rerolls at the jailer. Keys open treasure chests, coupons give 25% off your next purchase.","TUTORIAL_LOOT_TITLE":"Loot","TUTORIAL_LOOT":"After every fight the loot lies on the battlefield. Drag it into the bag, whatever stays behind is lost when you move on. Boxes, envelopes and trophy bags open the next time you enter the map.","TUTORIAL_NEXT":"Next","TUTORIAL_SKIP":"Skip tutorial","TUT_SEL_WELCOME":"A new face! I'm the trainer. Let me show you how to survive up north.","TUT_SEL_PATH":"This is your journey: five biomes, each with its own elements. At the very end the final boss is waiting.","TUT_SEL_DRAW":"First you need a partner. Draw three eggs!","TUT_SEL_PICK":"The color shows the rarity: rarer monsters are stronger. Tap an egg.","TUT_SEL_INFO":"Here you see species, element, rarity and stats of your monster, and how many of its egg moves you have unlocked.","TUT_SEL_GO":"Don't like it? Tap another egg. Ready? Then set off!","TUT_CFG_MON":"Your starter. Its element decides which skills it can use.","TUT_CFG_SLOTS":"It takes three egg moves into the run. These three slots are still empty.","TUT_CFG_GRID":"Below are all egg moves of the species. Drag three of them up into the slots (or tap them). Locked ones show how to unlock them in future runs.","TUT_CFG_GO":"Happy with your choice? Then off to the map!","TUT_MAP_INTRO":"This is the map of your first biome. The biome boss waits at the very top. Defeat it and you move on to the next biome.","TUT_MAP_TEAM":"Up here is your team. Lost HP does not come back on its own, only at a camp fire.","TUT_MAP_LEGEND":"Not sure what a field means? The legend explains all of them.","TUT_MAP_START":"You always move one row up, along the paths. Pick your first field!","TUT_BAT_INTRO":"Before you set off, a practice fight! Nothing can go wrong here: nobody faints and nothing counts for your run. I will explain everything.","TUT_BAT_WHEEL":"The turn wheel shows the order. The monster with the highest speed goes first.","TUT_BAT_INTENT":"This is what the enemy plans next: skill, target and damage. Use it to prepare.","TUT_BAT_CARD":"On your monster's turn you play its skill cards. Drag a card onto the enemy!","TUT_BAT_END":"Every skill costs moves and has a cooldown afterwards. Out of moves? End your turn.","TUT_BAT_CATCH":"Now the important part: catching! The spiral above the enemy shows your chance, the less HP it has, the better. Use Hypnosis before playing a card this turn. In practice it always works, then we head to the map!","TUT_BAT_ELEMENTS":"Elements matter: water beats fire, fire beats air, air beats earth and earth beats water. A good match deals 50% more damage, a bad one 50% less.","TUT_JUD_CATCHES":"Welcome to the judgement. Here are the monsters you caught in the fight.","TUT_JUD_TEAM":"This is your team, two monsters at most. Drag a catch onto a slot to add it to your team.","TUT_JUD_ZONES":"Or use the trays: Teach passes one of its moves on to your team, Sacrifice unlocks its egg move for good, Release lets it go.","TUT_JUD_CONFIRM":"Your turn: drag your catch onto a slot or a tray, then confirm. Whatever is left over will be released.","TUT_LOOT_XP":"Defeated enemies give experience, that's how your monsters level up. Catches don't count, so if you only catch, you'll fall behind.","TUT_LOOT_DRAG":"The loot lies on the battlefield. Drag it into the bag, whatever stays behind is lost when you move on.","TUT_TRN_CARDS":"Ah, it's you! Here your monsters learn new skills. On the left are my offers.","TUT_TRN_MONS":"Drag a card onto one of your monsters. Each knows up to six skills, but can only use those that match its elements.","TUT_TRN_PAY":"Teaching isn't free: you pay with Monster Essence.","TUT_JAIL_CAGES":"Welcome to my dungeon. Every cage holds a chained species.","TUT_JAIL_TEARS":"I only take Boss Tears. You get them for defeating biome bosses.","TUT_JAIL_CHAIN":"Drag a tear to me and pick a cage. Every chain you break gives that species one more action per turn. Forever, even in later runs.","TUT_JAIL_REROLL":"Don't like my prisoners? Pay some Essence and I'll bring in others.","TUT_CAMP_TEAM":"Psst, over here! I am the camp fire. Your team is resting here, and you can see how much HP it's missing.","TUT_CAMP_FEED":"Drag Monster Essence from the bag or the stacks into me. I turn every bite into HP for your team.","TUT_HUB":"The outpost before the boss. Rest, shop and trainer can each be used once. Prepare well!","TUT_TREASURE":"A treasure chest! You need a key to open it. Keys drop as loot or are sold in the shop.","TUT_GEMS":"Trophies! Each raises a stat of one monster for the rest of the run. Pick one and drag it onto a monster.","TUT_RELIC_REWARD":"A relic! It gives a passive bonus for the whole run. Drag one into the bag.","TUT_SKILL_REWARD":"An envelope with unique skills, free of charge. Drag one onto a monster, but choose wisely: only one!","TUT_BAT_BOSS":"Watch out for bosses: they are stronger, have more actions per turn and bring boss relics that empower them. In return they drop a relic chest and a skill envelope, and biome bosses also drop Boss Tears.","TUT_BAT_FAINTED":"In real fights your monsters can fall. After the fight you can revive one once by giving up a new catch. Otherwise it leaves something to your team in its last will. If your whole team falls, the run is over.","BIOME_INFO_HINT":"Click: strengths & weaknesses of this biome","BIOME_INFO_ELEMENTS":"Monsters here carry:","BIOME_INFO_ATTACK":"Your attacks","BIOME_INFO_STRONG":"Hit hard","BIOME_INFO_WEAK":"Bounce off","BIOME_INFO_NEUTRAL":"Neutral","BIOME_INFO_DEFENSE":"Your team","BIOME_INFO_DANGER":"In danger","BIOME_INFO_SAFE":"Holds up well","BIOME_INFO_BY":"from {element}","BIOME_INFO_AGAINST":"vs. {element}","BIOME_INFO_NONE":"none","BIOME_INFO_LEGEND":"Arrows point from the stronger to the weaker element. Green: your attacks deal +50 % per advantage. Red: attacks of the monsters here hit you harder. Each disadvantage halves the damage.","BIOME_INFO_CLOSE":"Close","ELEMENT_INFO_HINT":"Click: what this element is made of","ELEMENT_INFO_LEVEL":"Level {level} · {kind}","ELEMENT_INFO_BASE":"Base element","ELEMENT_INFO_FUSION":"Fusion of {count} elements","ELEMENT_INFO_BASE_DESC":"One of the four base elements, it cannot be split further. Fused with others it forms stronger combinations.","ELEMENT_INFO_CONTAINS":"Contains","ELEMENT_INFO_PART_OF":"Part of","EFFECT_LIGHTNING_DESC":"Lightning: the user gains [hl]+{speed}% Initiative[/hl] for [hl]{turns} turns[/hl]","EFFECT_STEAM_DESC":"Steam: the target loses [hl]{speed}% Initiative[/hl] for [hl]{turns} turns[/hl]","EFFECT_MUD_DESC":"Mud: the user gains [hl]+{attack}% Attack and Sp. Attack[/hl] for [hl]{turns} turns[/hl]","EFFECT_DUST_DESC":"Dust: the target loses [hl]{attack}% Attack and Sp. Attack[/hl] for [hl]{turns} turns[/hl]","EFFECT_MAGMA_DESC":"Magma: hits drain shields [hl]{magma}x[/hl] as fast","EFFECT_ICE_DESC":"Ice: the user gains a [hl]shield[/hl] worth [hl]{ice}%[/hl] of the damage dealt","EFFECT_SWAMP_DESC":"Swamp: [hl]poisons[/hl] the target. Before each of its turns it loses [hl]{poison}% max HP[/hl] per stack (up to [hl]{stacks}[/hl]) until the battle ends. Ignores magic shields.","EFFECT_ASH_STORM_DESC":"Ash Storm: [hl]burns[/hl] the target. After each of its turns it loses [hl]{burn}% max HP[/hl] and it has [hl]-{burn_attack}% Attack[/hl] until the battle ends. Ignores armor.","EFFECT_THUNDERSTORM_DESC":"Thunderstorm: [hl]paralyzes[/hl] the target. Each turn it has a [hl]{paralysis}% chance[/hl] to be stunned and lose its turn until the battle ends.","EFFECT_VOLCANO_DESC":"Volcano: [hl]{volcano}% chance[/hl] to take effect [hl]twice[/hl]","EFFECT_CHAOS_DESC":"Chaos: [hl]+{chaos}[/hl] element multiplier against all non-Chaos targets","STATUS_POISON":"Poison","STATUS_BURN":"Burn","STATUS_PARALYSIS":"Paralysis","STATUS_WEAKENED":"Weakened","EFFECT_TEXT_STUNNED":"Stunned!","EFFECT_TEXT_ERUPTION":"Eruption!","EFFECT_CHANCE_PREFIX":"[hl]{chance}% chance[/hl] -","BOSS_RELIC_HEAL_MOSS":"Healing Moss","BOSS_RELIC_HEAL_MOSS_DESC":"Enemies heal for {value}% of the damage they deal.","BOSS_RELIC_EMBER_FLOOR":"Ember Floor","BOSS_RELIC_EMBER_FLOOR_DESC":"At the start of every round, all your monsters lose {value}% of their max HP.","BOSS_RELIC_FATE_MIRROR":"Mirror of Fate","BOSS_RELIC_FATE_MIRROR_DESC":"The damage an enemy deals becomes a shield of the same kind (physical or magic) on its next turn.","BOSS_RELIC_BONGOS":"Bongos","BOSS_RELIC_BONGOS_DESC":"At the start of each turn, enemies alternately gain armor and magic armor ({value}% of their (Sp.) Defense).","BOSS_RELIC_FOG_MACHINE":"Fog Machine","BOSS_RELIC_FOG_MACHINE_DESC":"Attacks against enemies have a {value}% chance to miss.","BOSS_RELIC_SWIFT_WEASEL":"Swift Weasel","BOSS_RELIC_SWIFT_WEASEL_DESC":"Enemies alternately act first and last: first in odd rounds, last in even rounds.","BOSS_RELIC_MICROPHONE":"Microphone","BOSS_RELIC_MICROPHONE_DESC":"In odd rounds every turn is skipped. Instead, every monster heals {value}% of its missing HP.","BOSS_RELIC_MAGIC_THORNS":"Magic Thorns","BOSS_RELIC_MAGIC_THORNS_DESC":"Enemies reflect {value}% of the damage they take back to the attacker: physical damage in odd rounds, magic damage in even rounds.","BOSS_RELIC_INTRO_TITLE":"Boss Relics","BOSS_RELIC_INTRO_HINT":"They empower all enemies until the last one is defeated or caught.","BOSS_RELIC_START":"Let's go!","BOSS_RELIC_CLOSE":"Close","BATTLE_SPEED_TOOLTIP":"Battle speed (left click: faster, right click: slower)","BATTLE_AUTO_END_TOOLTIP":"Auto end turn: ends your turn as soon as no card can be played","BOSS_RELIC_BROKEN":"You beat the boss so hard that its rel ELICS":"Noch keine Relikte","MAP_TEAM_ENTRY":"{name}  Lv {level}","MAP_TEAM_HP":"{hp} / {max} KP","MAP_LEGEND":"Legende","MAP_LEGEND_HINT":"Klicke auf einen Eintrag für Details.","MAP_NODE_COMBAT_DESC":"Ein Kampf gegen wilde Monster aus dem aktuellen Biom. Siege bringen Monster Essenz und Erfahrung, geschwächte Gegner kannst du fangen. Mit jedem Kampf im Biom werden die nächsten Gegner etwas stärker.","MAP_NODE_BOSS_DESC":"Ein Kampf in Boss-Stärke mitten auf der Karte: mehr und zähere Gegner als sonst. Er beendet das Biom nicht, das passiert erst beim Boss ganz oben.","MAP_NODE_CAMP_DESC":"Ein Rastplatz: füttere das Feuer mit Monster Essenz und es heilt deine Monster.","MAP_NODE_SHOP_DESC":"Hier gibst du Monster Essenz aus: Element-Tränke geben einem Monster ein zusätzliches Element (damit kann es mehr Skills einsetzen), Trophäen erhöhen einen Wert für den restlichen Run, Relikte geben passive Boni.","MAP_NODE_TRAINER_DESC":"Bringt deinen Monstern seltene Skills bei, die Hälfte davon mit mehreren Elementen. Ein Monster kann einen Skill nur einsetzen, wenn es alle seine Elemente hat, die Bilder auf jeder Karte zeigen, wer passt. Ohne freien Platz ersetzt du einen alten Skill. Bezahlt wird erst, wenn der Skill gelernt ist.","MAP_NODE_JAILER_DESC":"Der Kerkermeister hält bis zu drei Monster-Arten in Ketten. Jede Kette ist eine fehlende Verbesserung (+1 Aktion pro Zug). Gib ihm eine Boss Träne, um eine Kette zu sprengen, ist die letzte weg, ist die Art frei und voll verbessert, dauerhaft, auch für spätere Runs. Andere Gefangene zeigen kostet Monster Essenz.","MAP_NODE_EVENT_DESC":"Ein Zufallsereignis: ein Lager, das deine Monster heilt, das Glücksrad, bei dem du die Hälfte deiner Monster Essenz gewinnst oder verlierst, oder der Void, der ein Relikt gegen ein anderes gleicher Seltenheit tauscht.","MAP_NODE_TREASURE_DESC":"Eine Kiste voller Monster Essenz, zum Öffnen brauchst du einen Schlüssel.","MAP_NODE_GEM_DESC":"Wähle eine von drei Trophäen. Sie erhöht einen Wert eines Monsters (z. B. Angriff oder KP) für den restlichen Run. Je tiefer du bist, desto stärker die Trophäen.","MAP_NODE_HUB":"RASTLAGER","MAP_NODE_HUB_DESC":"Das letzte Feld jedes Pfads, direkt vor dem Boss. Hier kannst du dich ausruhen (Monster Essenz im Feuer heilt), den Laden und den Trainer besuchen, jedes einmal. Mach dein Team bereit für den Bosskampf!","CAMP_FIRE_ASK":"Füttere mich mit Monster Essenzen, im Gegenzug schreibe ich euch das als Leben gut! 1 ME = {hp} KP für jedes Monster.","CAMP_FIRE_EATING":"Omnomnom nom nom nomnom, lecker!","CAMP_FEED_POOR":"Dafür hast du nicht genug Essenz.","SKILL_REWARD_CHOOSE":"Wähle einen Skill","SKILL_REWARD_HINT":"Zieh einen Skill auf ein Monster, um ihn ihm beizubringen. Nur einen!","SKILL_REWARD_SKIP":"Keinen Skill nehmen","SKILL_QUAKE_HAMMER":"Bebenhammer","SKILL_LANDSLIDE":"Erdrutsch","SKILL_BEDROCK_WARD":"Felsgrundwacht","SKILL_DEEP_ROOTS":"Tiefe Wurzeln","SKILL_SUNFORGE_BLOW":"Sonnenschmiede","SKILL_ASH_RAIN":"Aschenregen","SKILL_KILN_HIDE":"Ofenhaut","SKILL_HEARTH_SOUL":"Herdseele","SKILL_ABYSS_LANCE":"Abgrundlanze","SKILL_RIPTIDE_WAVE":"Sogwelle","SKILL_PEARL_WARD":"Perlenwacht","SKILL_WELLSPRING":"Urquell","SKILL_SKY_RENDER":"Himmelsriss","SKILL_GALE_SWEEP":"Orkanfeger","SKILL_ZEPHYR_MANTLE":"Zephirmantel","SKILL_STORM_HEART":"Sturmherz","HUB_TITLE":"Rastlager","HUB_DESC":"Letzte Rast vor dem Boss. Jede Station kannst du einmal nutzen.","HUB_REST":"AUSRUHEN","HUB_DONE":"{station} (erledigt)","HUB_CONTINUE":"Weiterziehen","MAP_HEADER_ROUTE":"Route:","EGG_OVERVIEW_TITLE":"Ei-Attacken freigeschaltet","EGG_OVERVIEW_UNLOCKED":"Freigeschaltet","EGG_OVERVIEW_LOCKED":"Gesperrt","EGG_DETAIL_ELEMENT":"Element: {element}","EGG_CATEGORY_PHYSICAL":"Physisch","EGG_CATEGORY_MAGIC":"Magisch","EGG_CATEGORY_SHIELD":"Schild","EGG_CATEGORY_BUFF":"Buff","EGG_CATEGORY_PASSIVE":"Passiv","EGG_SOURCE_DEFAULT":"Freigeschaltet (von Anfang an)","EGG_SOURCE_DEFAULT_HINT":"Standard-Ei-Attacke: Diese Art beherrscht sie von Anfang an","EGG_SOURCE_SACRIFICE":"Freigeschaltet (gefangen & geopfert)","EGG_SOURCE_SACRIFICE_HINT":"Ei-Attacke: Du hast dieses Monster gefangen und geopfert","EGG_SOURCE_MILESTONE":"Freigeschaltet (Meilenstein)","EGG_SOURCE_BOUNTY":"Freigeschaltet (Bounty Hunter)","MILESTONE_SOURCE_BOSS_1":"Meilenstein-Ei-Attacke: Du hast einen Biom-Boss mit diesem Monster als Start-Monster besiegt","MILESTONE_SOURCE_BOSS_5":"Meilenstein-Ei-Attacke: Du hast 5 Biom-Bosse mit diesem Monster als Start-Monster besiegt","MILESTONE_SOURCE_GAME_WIN":"Meilenstein-Ei-Attacke: Du hast das Spiel mit diesem Monster als Start-Monster beendet","BOUNTY_SOURCE_ALPHA_1":"Bounty Hunter: Du hast Alpha Böenmähne mit diesem Monster besiegt (letzter Treffer)","BOUNTY_SOURCE_ALPHA_2":"Bounty Hunter: Du hast Alpha Leuchtkrabbe mit diesem Monster besiegt (letzter Treffer)","BOUNTY_SOURCE_NORTHERN_WARDEN":"Bounty Hunter: Du hast den Nordwächter mit diesem Monster besiegt (letzter Treffer)","JAILER_TEAR_COUNT_ONE":"{amount} Boss Träne","JAILER_TEAR_COUNT_MANY":"{amount} Boss Tränen","TREASURE_HINT":"Zieh die ganze Essenz in die Tasche.","GEM_HINT":"Zieh eine Trophäe auf eines deiner Monster.","RELIC_REWARD_HINT":"Zieh ein Relikt in die Tasche.","BATTLE_CATCH_CALL_1":"Komm...","BATTLE_CATCH_CALL_2":"Folge mir...","MONSTER_INFO_BACK":"Zurück","TUTORIAL_TITLE":"So funktioniert's","TUTORIAL_SCROLL_HINT":"Scrolle nach unten für alle Erklärungen.","TUTORIAL_GOAL_TITLE":"Das Ziel","TUTORIAL_GOAL":"Reise durch fünf Biome bis in den Norden. Jedes Biom ist eine Karte voller Felder, oben wartet der Biom-Boss. Besiegst du den Boss des letzten Bioms, hast du gewonnen. Fällt dein ganzes Team, ist der Run vorbei.","TUTORIAL_START_TITLE":"Der Start","TUTORIAL_START":"Ziehe drei Eier und wähle eines davon als Start-Monster. Danach suchst du drei Ei-Attacken aus, die es in den Run mitnimmt. Faule Eier? Mit vollen Ladungen kannst du sie neu würfeln.","TUTORIAL_RARITY_TITLE":"Seltenheit","TUTORIAL_RARITY":"Die Farbe eines Eis zeigt die Seltenheit der Art. Seltenere Monster sind stärker, aber schwerer zu fangen.","TUTORIAL_MAP_TITLE":"Die Karte","TUTORIAL_MAP":"Feld für Feld wählst du deinen Weg nach oben. Die Legende auf der Karte erklärt jedes Feld. Verlorenes Leben kommt nicht von selbst zurück: Füttere ein Lagerfeuer mit Monster Essenz, um zu heilen.","TUTORIAL_BATTLE_TITLE":"Kämpfen","TUTORIAL_BATTLE":"Das Zugrad zeigt die Reihenfolge, das schnellste Monster (Initiative) beginnt. Ist dein Monster am Zug, spielst du seine Skill-Karten: Zieh sie auf ein Ziel. Jeder Skill kostet Züge und hat danach eine Abklingzeit. Über jedem Gegner steht, was er als Nächstes vorhat, also schütze dich oder schlag zuerst zu. Mit Zugende ist das nächste Monster dran.","TUTORIAL_ELEMENTS_TITLE":"Elemente","TUTORIAL_ELEMENTS":"Es gibt vier Grundelemente: Erde, Feuer, Wasser und Luft. Zusammen ergeben sie Mischelemente wie Eis, Dampf oder Magma. Ein Monster kann einen Skill nur einsetzen, wenn es alle seine Elemente hat. Passt das Element gut gegen das Ziel, ist der Treffer sehr effektiv, sonst schwächer. Element-Tränke aus dem Laden geben einem Monster ein weiteres Element.","TUTORIAL_CATCH_TITLE":"Fangen","TUTORIAL_CATCH":"Wilde Monster kannst du mit Hypnose fangen. Die Spirale über dem Gegner zeigt deine Chance: Je weniger Leben er noch hat, desto besser. Unter 10 % Leben wird es leichter, unter 5 % noch mehr. Hohe Stufe und Seltenheit machen es schwerer.","TUTORIAL_TEAM_TITLE":"Dein Team","TUTORIAL_TEAM":"Dein Team hat höchstens zwei Monster. Nach einem Kampf mit Fängen entscheidest du im Gericht: einen Fang ins Team holen (dafür geht ein anderes), ihn eine Attacke an dein Team weitergeben lassen, ihn opfern oder freilassen. Was übrig bleibt, wird freigelassen. Ist eines deiner Monster gefallen, kannst du es einmalig wiederbeleben, indem du dafür einen neuen Fang hergibst. Neue Teammitglieder starten mit vollem Leben.","TUTORIAL_EGG_MOVES_TITLE":"Ei-Attacken","TUTORIAL_EGG_MOVES":"Ei-Attacken werden dauerhaft für eine Art freigeschaltet. Dafür gibt es drei Wege: Fange ein Monster mit Ei-Attacke und opfere es im Gericht, erreiche Meilensteine mit der Art als Start-Monster (z. B. Biom-Bosse besiegen) oder kassiere Kopfgelder, indem du besondere Alpha-Monster mit dem letzten Treffer besiegst. Nach einem Boss-Kampf kann das Ei eines deiner Monster in der Beute liegen, ab dann kann es dein Start-Monster sein.","TUTORIAL_STRONGER_TITLE":"Stärker werden","TUTORIAL_STRONGER":"Kämpfe bringen Erfahrung, deine Monster steigen auf. Trophäen erhöhen einen Wert für den restlichen Run. Der Trainer und Couverts bringen neue Skills (bis zu sechs pro Monster), Element-Tränke machen weitere nutzbar. Beim Kerkermeister sprengen Boss Tränen Ketten: Jede Kette gibt einer Art dauerhaft einen Zug mehr pro Runde, auch in späteren Runs.","TUTORIAL_RELICS_TITLE":"Relikte","TUTORIAL_RELICS":"Relikte geben passive Boni für den ganzen Run, zum Beispiel eine bessere Fangchance. Du bekommst sie aus Kisten nach Boss-Kämpfen oder im Laden, und der Void tauscht eines gegen ein anderes gleicher Seltenheit. Deine Relikte stehen oben auf der Karte, fahre darüber für Details.","TUTORIAL_ESSENCE_TITLE":"Monster Essenz","TUTORIAL_ESSENCE":"Monster Essenz (ME) ist die Währung. Du bekommst sie in Kämpfen und Schätzen und gibst sie im Laden, beim Trainer, am Lagerfeuer (Heilung) oder fürs Neuwürfeln beim Kerkermeister aus. Schlüssel öffnen Schatzkisten, Gutscheine geben 25% Rabatt auf den nächsten Kauf.","TUTORIAL_LOOT_TITLE":"Beute","TUTORIAL_LOOT":"Nach jedem Kampf liegt die Beute auf dem Schlachtfeld. Zieh sie in die Tasche, was liegen bleibt, ist beim Weitergehen verloren. Kisten, Couverts und Trophäen-Beutel öffnen sich beim nächsten Betreten der Karte.","TUTORIAL_NEXT":"Weiter","TUTORIAL_SKIP":"Tutorial überspringen","TUT_SEL_WELCOME":"Na, ein neues Gesicht! Ich bin der Trainer. Ich zeige dir, wie man im Norden überlebt.","TUT_SEL_PATH":"Das ist deine Reise: fünf Biome, jedes mit eigenen Elementen. Ganz am Ende wartet der Endboss.","TUT_SEL_DRAW":"Zuerst brauchst du einen Partner. Zieh drei Eier!","TUT_SEL_PICK":"Die Farbe zeigt die Seltenheit: Seltenere Monster sind stärker. Tipp ein Ei an.","TUT_SEL_INFO":"Hier siehst du Art, Element, Seltenheit und Werte deines Monsters und wie viele seiner Ei-Attacken du schon freigeschaltet hast.","TUT_SEL_GO":"Gefällt es dir nicht? Tipp ein anderes Ei an. Bereit? Dann brich auf!","TUT_CFG_MON":"Dein Start-Monster. Sein Element entscheidet, welche Skills es einsetzen kann.","TUT_CFG_SLOTS":"Es nimmt drei Ei-Attacken mit in den Run. Diese drei Plätze sind noch leer.","TUT_CFG_GRID":"Darunter stehen alle Ei-Attacken der Art. Zieh drei davon hoch in die Plätze (oder tippe sie an). Gesperrte zeigen, wie du sie in künftigen Runs freischaltest.","TUT_CFG_GO":"Zufrieden mit deiner Wahl? Dann auf zur Karte!","TUT_MAP_INTRO":"Das ist die Karte deines ersten Bioms. Ganz oben wartet der Biom-Boss. Besiegst du ihn, geht es ins nächste Biom.","TUT_MAP_TEAM":"Hier oben steht dein Team. Verlorenes Leben kommt nicht von selbst zurück, nur am Lagerfeuer.","TUT_MAP_LEGEND":"Unsicher, was ein Feld bedeutet? Die Legende erklärt alle.","TUT_MAP_START":"Du gehst immer eine Reihe weiter, den Wegen entlang. Wähle dein erstes Feld!","TUT_BAT_INTRO":"Bevor du aufbrichst, ein Übungskampf! Hier kann nichts schiefgehen: Niemand geht K.O. und nichts zählt für deinen Run. Ich erkläre dir alles.","TUT_BAT_WHEEL":"Das Zugrad zeigt die Reihenfolge. Das Monster mit der höchsten Initiative beginnt.","TUT_BAT_INTENT":"Hier steht, was der Gegner als Nächstes vorhat: Skill, Ziel und Schaden. So kannst du dich darauf einstellen.","TUT_BAT_CARD":"Ist dein Monster am Zug, spielst du seine Skill-Karten. Zieh eine Karte auf den Gegner!","TUT_BAT_END":"Jeder Skill kostet Züge und hat danach eine Abklingzeit. Keine Züge mehr? Beende deinen Zug.","TUT_BAT_CATCH":"Jetzt das Wichtigste: Fangen! Die Spirale über dem Gegner zeigt deine Chance, je weniger Leben er hat, desto besser. Setz Hypnose ein, bevor du in diesem Zug eine Karte spielst. In der Übung klappt es immer, danach geht es zur Karte!","TUT_BAT_ELEMENTS":"Elemente zählen: Wasser schlägt Feuer, Feuer schlägt Luft, Luft schlägt Erde und Erde schlägt Wasser. Passt das Element, gibt es 50 % mehr Schaden, sonst 50 % weniger.","TUT_JUD_CATCHES":"Willkommen im Gericht. Hier liegen die Monster, die du im Kampf gefangen hast.","TUT_JUD_TEAM":"Das ist dein Team, höchstens zwei Monster. Zieh einen Fang auf einen Platz, um ihn aufzunehmen.","TUT_JUD_ZONES":"Oder: Lehren gibt eine seiner Attacken an dein Team weiter, Opfern schaltet seine Ei-Attacke dauerhaft frei, Freilassen lässt ihn gehen.","TUT_JUD_CONFIRM":"Jetzt du: Zieh deinen Fang auf einen Platz oder eine Ablage und bestätige dann. Was übrig bleibt, wird freigelassen.","TUT_LOOT_XP":"Besiegte Gegner bringen Erfahrung, so steigen deine Monster auf. Fänge zählen nicht: Wer nur fängt, fällt zurück.","TUT_LOOT_DRAG":"Die Beute liegt auf dem Schlachtfeld. Zieh sie in die Tasche, was liegen bleibt, ist beim Weitergehen verloren.","TUT_TRN_CARDS":"Ah, du bist es! Hier lernen deine Monster neue Skills. Links liegen meine Angebote.","TUT_TRN_MONS":"Zieh eine Karte auf eines deiner Monster. Jedes kennt bis zu sechs Skills, einsetzen kann es nur die, deren Elemente es hat.","TUT_TRN_PAY":"Umsonst ist das nicht: Bezahlt wird mit Monster Essenz.","TUT_JAIL_CAGES":"Willkommen in meinem Kerker. In jedem Käfig sitzt eine angekettete Art.","TUT_JAIL_TEARS":"Ich nehme nur Boss Tränen. Die bekommst du für besiegte Biom-Bosse.","TUT_JAIL_CHAIN":"Zieh eine Träne zu mir und wähl einen Käfig. Jede gesprengte Kette gibt der Art eine Aktion mehr pro Zug. Für immer, auch in späteren Runs.","TUT_JAIL_REROLL":"Gefallen dir meine Gefangenen nicht? Für Essenz hole ich andere.","TUT_CAMP_TEAM":"Psst, hier drüben! Ich bin das Lagerfeuer. Hier ruht dein Team, du siehst, wie viel Leben ihm fehlt.","TUT_CAMP_FEED":"Zieh Monster Essenz aus der Tasche oder von den Stapeln in mich hinein. Jeden Bissen mache ich zu Leben für dein Team.","TUT_HUB":"Das Rastlager vor dem Boss. Ausruhen, Laden und Trainer kannst du je einmal nutzen. Bereite dich gut vor!","TUT_TREASURE":"Eine Schatzkiste! Zum Öffnen brauchst du einen Schlüssel. Schlüssel gibt es als Beute oder im Laden.","TUT_GEMS":"Trophäen! Jede erhöht einen Wert eines Monsters für den restlichen Run. Wähl eine und zieh sie auf ein Monster.","TUT_RELIC_REWARD":"Ein Relikt! Es gibt dir einen passiven Bonus für den ganzen Run. Zieh eines in die Tasche.","TUT_SKILL_REWARD":"Ein Couvert mit einzigartigen Skills, ganz umsonst. Zieh einen auf ein Monster, aber wähl gut: nur einen!","TUT_BAT_BOSS":"Vorsicht bei Bossen: Sie sind stärker, haben mehr Aktionen pro Zug und bringen Boss-Relikte mit, die sie stärken. Dafür lassen sie eine Relikt-Kiste und ein Couvert mit Skills fallen, Biom-Bosse auch Boss Tränen.","TUT_BAT_FAINTED":"In echten Kämpfen können deine Monster fallen. Nach dem Kampf kannst du eines einmal wiederbeleben, indem du dafür einen neuen Fang hergibst. Sonst hinterlässt es deinem Team einen Letzten Willen. Fällt dein ganzes Team, ist der Run vorbei.","BIOME_INFO_HINT":"Klicken: Stärken & Schwächen dieses Bioms","BIOME_INFO_ELEMENTS":"Monster hier tragen:","BIOME_INFO_ATTACK":"Deine Angriffe","BIOME_INFO_STRONG":"Treffen hart","BIOME_INFO_WEAK":"Prallen ab","BIOME_INFO_NEUTRAL":"Neutral","BIOME_INFO_DEFENSE":"Dein Team","BIOME_INFO_DANGER":"In Gefahr","BIOME_INFO_SAFE":"Hält gut stand","BIOME_INFO_BY":"durch {element}","BIOME_INFO_AGAINST":"gegen {element}","BIOME_INFO_NONE":"keine","BIOME_INFO_LEGEND":"Pfeile zeigen vom stärkeren zum schwächeren Element. Grün: deine Angriffe machen +50 % pro Vorteil. Rot: Angriffe der Monster hier treffen dich härter. Jeder Nachteil halbiert den Schaden.","BIOME_INFO_CLOSE":"Schließen","ELEMENT_INFO_HINT":"Klicken: woraus dieses Element besteht","ELEMENT_INFO_LEVEL":"Stufe {level} · {kind}","ELEMENT_INFO_BASE":"Grundelement","ELEMENT_INFO_FUSION":"Verschmel function localGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function localSet(key, value) { try { localStorage.setItem(key, value); } catch {} }

const ui = (key) => (UI[state.lang] || UI.en)[key] ?? UI.en[key] ?? key;

const rarityName = (r) => tr("RARITY_" + r);
// wie Monmap.RARITY_COLORS, mythisch als Verlauf Dunkelrot -> Schwarz
const RARITY_STYLE = { COMMON: "color:#bfbfbf", UNCOMMON: "color:#59d959", RARE: "color:#4d99ff", EPIC: "color:#bf59ff", LEGENDARY: "color:#ffa626",
	MYTHIC: "color:#fff;background:linear-gradient(90deg,#9a0d12,#0d0002);border-color:#5a0008" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function tr(key, args = {}) {
	const text = DATA.tr[state.lang]?.[key] || DATA.tr.en?.[key] || key;
	// [hl]...[/hl] färbt im Spiel wichtige Stellen gelb, im Wiki entfällt es
	return text.replace(/\[\/?hl\]/g, "").replace(/\{(\w+)\}/g, (all, k) => (k in args ? args[k] : all));
}
const res = (p) => (p || "").replace(/^res:\/\//, "../");
const pct = (v) => `${Math.round(v * 1000) / 10} %`;
const fmtNum = (v) => (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100));

const BASE = DATA.elements.base;
const BASE_MASKS = Object.values(BASE);
const comboByMask = Object.fromEntries(DATA.elements.combos.map((c) => [c.mask, c]));
const elementsIn = (mask) => BASE_MASKS.filter((e) => mask & e);
const elementName = (mask) => tr(comboByMask[mask]?.label || "ELEMENT_UNKNOWN");
const elementColor = (mask) => comboByMask[mask]?.color || "#555555";
const chip = (mask) => `<span class="chip"><i style="background:${esc(elementColor(mask))}"></i>${esc(elementName(mask))}</span>`;

// Spiegelt ElementEffects.element_effect_text (Standardwerte, ohne effect_power einer Karte), "" für Grundelemente
const effectPct = (share) => fmtNum(Math.round(share * 1000) / 10);
function elementEffectText(mask) {
	const key = DATA.elements.effectKeys?.[mask];
	if (!key) return "";
	const c = DATA.elements.effects;
	return tr(`EFFECT_${key}_DESC`, {
		turns: c.EFFECT_TURNS,
		speed: effectPct(c.SPEED_FACTOR),
		attack: effectPct(c.ATTACK_FACTOR),
		magma: fmtNum(Math.round(c.MAGMA_SHIELD_COST * 10) / 10),
		ice: effectPct(c.ICE_SHIELD_SHARE),
		poison: effectPct(c.POISON_SHARE),
		stacks: c.POISON_MAX_STACKS,
		burn: effectPct(c.BURN_SHARE),
		burn_attack: effectPct(c.BURN_ATTACK_FACTOR),
		paralysis: effectPct(c.PARALYSIS_CHANCE),
		volcano: effectPct(c.VOLCANO_CHANCE),
		chaos: Number(c.CHAOS_BONUS).toFixed(2),
	// "Blitz: ..." – der Elementname steht im Wiki schon daneben
	}).replace(/^[^:]+:\s*/, "");
}

// Spiegelt Skills.element_score / element_multiplier
function elementScore(skillNature, targetType) {
	const strong = DATA.elements.strongAgainst;
	let score = 0;
	for (const a of BASE_MASKS) {
		if (!(skillNature & a)) continue;
		for (const d of BASE_MASKS) {
			if (!(targetType & d)) continue;
			if (strong[a] === d) score++;
			else if (strong[d] === a) score--;
		}
	}
	return score;
}
function elementMultiplier(skillNature, targetType) {
	const score = elementScore(skillNature, targetType);
	const bonus = DATA.elements.elementBonus;
	return score >= 0 ? 1 + bonus * score : Math.pow(1 - bonus, -score);
}
const covers = (typeMask, nature) => (nature & ~typeMask) === 0;

// Skills

const skillByName = Object.fromEntries(DATA.skills.map((s) => [s.name, s]));
const tierStars = (t) => "◆".repeat(t || 1) + `<span class="muted">${"◇".repeat(Math.max(0, 4 - (t || 1)))}</span>`;
const dmgType = (s) => (s.damage_type === "ABILITY" ? ui("ability") : ui("physical"));
// Wie Helper.skill_description: Haupttext mit {stat}/{element}, darunter die Extras (Skills.extras_text) und der
// Element-Effekt der Karte (ElementEffects.skill_effect_text, mit effect_chance / effect_power der Karte)
const STAT_KEYS = { hp: "STAT_HP", atk: "STAT_ATK", def: "STAT_DEF", s_atk: "STAT_SPA", s_def: "STAT_SPD", speed: "STAT_SPE" };
const statLabel = (stat) => (STAT_KEYS[stat] ? tr(STAT_KEYS[stat]).replace(":", "") : stat || "");
function skillEffectText(s) {
	const key = DATA.elements.effectKeys?.[s.nature];
	if (!key) return "";
	const E = DATA.elements.effects;
	let power = s.effect_power ?? 1;
	let chance = s.effect_chance ?? 1;
	if (key === "VOLCANO") { power *= chance; chance = 1; }
	if (key === "MAGMA") chance = 1;
	const pct = (x) => fmtNum(Math.round(x * 1000) / 10);
	const text = tr(`EFFECT_${key}_DESC`, {
		turns: E.EFFECT_TURNS, speed: pct(E.SPEED_FACTOR * power), attack: pct(E.ATTACK_FACTOR * power),
		magma: fmtNum(Math.round((1 + (E.MAGMA_SHIELD_COST - 1) * power) * 10) / 10), ice: pct(E.ICE_SHIELD_SHARE * power),
		poison: pct(E.POISON_SHARE * power), stacks: E.POISON_MAX_STACKS, burn: pct(E.BURN_SHARE * power),
		burn_attack: pct(E.BURN_ATTACK_FACTOR * power), paralysis: pct(E.PARALYSIS_CHANCE * power),
		volcano: pct(E.VOLCANO_CHANCE * power), chaos: E.CHAOS_BONUS,
	});
	return chance < 1 ? tr("EFFECT_CHANCE_PREFIX", { chance: Math.round(chance * 100) }) + text : text;
}
function skillDesc(s) {
	const lines = [tr(s.description, {
		value: fmtNum(s.value ?? s.damage ?? 0), buff_turns: s.buff_turns ?? "",
		stat: statLabel(s.buff_stat ?? s.passive_stat), element: elementName(s.passive_element ?? s.nature),
	})];
	for (const x of s.extras || []) {
		const key = "SKILL_EXTRA_" + x.kind.toUpperCase() + (x.kind === "charge" ? "_" + x.stat.toUpperCase() : "");
		let text = tr(key, { value: fmtNum(x.value), turns: x.turns, stat: statLabel(x.stat), share: 50 });
		if (x.chance != null && x.chance < 1) text = tr("EFFECT_CHANCE_PREFIX", { chance: Math.round(x.chance * 100) }) + text;
		lines.push(text);
	}
	const effect = skillEffectText(s);
	if (effect) lines.push(effect);
	return lines.join(" · ");
}
// Woher man den Skill bekommt, über die Arten hinaus: Trainer, wilde Monster (Biom-Pool)
const POOL_LISTS = ["egg_skills", "defensive_skills", "buff_skills", "passive_skills", "area_skills"];
function skillSources(s) {
	if (!POOL_LISTS.includes(s.list)) return ui("lists")[s.list] || s.list;
	const parts = [];
	if (s.trainer !== false && (s.tier || 1) >= 2) parts.push(ui("trainer"));
	if (s.wild !== false) parts.push(ui("wild"));
	return parts.join(", ") || ui("onlySpecies");
}
const skillLabel = (name) => {
	const s = skillByName[name];
	return s ? `${chip(s.nature)} <b>${esc(tr(name))}</b> <span class="tier small">${tierStars(s.tier)}</span>` : `<b>${esc(tr(name))}</b>`;
};
function skillWeight(s, depth = 0) {
	const t = s.tier || 1;
	return DATA.tierWeights[t] * Math.pow(1 + DATA.depthTierBonus * depth, t - 1);
}

function matches(...texts) {
	if (!state.query) return true;
	const q = state.query.toLowerCase();
	return texts.some((t) => String(t ?? "").toLowerCase().includes(q));
}
function hl(text) {
	const s = esc(text);
	if (!state.query) return s;
	const q = state.query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
	return s.replace(new RegExp(`(${esc(q)})`, "gi"), "<mark>$1</mark>");
}

const popcount = (mask) => elementsIn(mask).length;

// Ein Skill mit allen Werten, wie ihn das Monster einsetzt
// wie Skills.standard_rarity_bonus: Standard-Skills werden pro Seltenheitsstufe über Gewöhnlich etwas stärker
const standardBonusPerStep = (s) => (s.standard && DATA.standardRarityBonus?.[s.effect]) || 0;
function standardRarityBonus(s, m) {
	return m ? standardBonusPerStep(s) * (DATA.enums.MON_RARITY?.[m.rarity] ?? 0) : 0;
}
function skillCard(name, m, how) {
	const base = skillByName[name];
	if (!base) return `<li class="skill-card"><b>${esc(tr(name))}</b>${how ? `<div class="how">${esc(how)}</div>` : ""}</li>`;
	const bonus = standardRarityBonus(base, m);
	const s = bonus ? { ...base, value: base.value + bonus } : base;
	const value = s.value ?? s.damage;
	const awake = covers(m.initial_type, s.nature);
	// wie Skills.dormant_power
	const share = popcount(s.nature & m.initial_type) / Math.max(popcount(s.nature), 1);
	const dormant = (DATA.dormantBasePower ?? 0.4) + (1 - (DATA.dormantBasePower ?? 0.4)) * share;
	const meta = [
		value != null ? `${ui("power")} <b>${fmtNum(value)}</b>${bonus ? ` <span class="small muted" title="${esc(ui("rarityBonusHint"))}">(${fmtNum(base.value)} + ${fmtNum(bonus)} ${esc(rarityName(m.rarity))})</span>` : ""}${!awake ? ` <span title="${esc(ui("dormantHint").replace("{power}", Math.round(dormant * 100)))}">(→ ${fmtNum(Math.max(Math.round(value * dormant), 1))})</span>` : ""}` : "",
		s.effect ? `${ui("effect")} <b>${esc(ui("effects")[s.effect] || s.effect)}</b>` : "",
		`<b>${dmgType(s)}</b>`,
		s.cost != null ? `${ui("cost")} <b>${s.cost}</b>` : "",
		s.cooldown != null ? `${ui("cd")} <b>${s.cooldown}</b>` : "",
		s.target ? `${ui("target")} <b>${esc(ui("targets")[s.target] || s.target)}</b>` : "",
	].filter(Boolean).map((x) => `<span>${x}</span>`).join("");
	return `<li class="skill-card">
		<div class="row" style="gap:6px">${chip(s.nature)} <b>${esc(tr(name))}</b> <span class="tier small">${tierStars(s.tier)}</span>
			${!awake ? `<span class="tag dormant" title="${esc(ui("dormantHint").replace("{power}", Math.round(dormant * 100)))}">${esc(tr("SKILL_DORMANT").split(":")[0])}</span>` : ""}</div>
		<div class="meta">${meta}</div>
		<p>${esc(skillDesc(s))}</p>
		${how ? `<div class="how">${esc(how)}</div>` : ""}
	</li>`;
}

function renderMonDetail(m) {
	const catchBase = DATA.catch.rarityBase?.[m.rarity];
	const labels = { hp: "HP", atk: "ATK", def: "DEF", s_atk: "SPA", s_def: "SPD", speed: "SPE" };
	const maxPref = Math.max(...Object.values(m.preferred_stats || { x: 1 }));
	const bars = m.preferred_stats ? `<div class="skill-group"><h4 title="${esc(ui("preferredHint"))}">${ui("preferredStats")}</h4><div class="bars">${
		Object.entries(labels).map(([key, label]) => {
			const v = m.preferred_stats[key] ?? 0;
			return `<div class="bar-row"><span class="muted">${esc(tr("STAT_" + label).replace(":", ""))}</span><div class="track"><div class="fill" style="width:${(v / maxPref) * 100}%"></div></div><span class="v">${v} %</span></div>`;
		}).join("")}</div><p class="small muted" style="margin:6px 0 0">${esc(ui("preferredHint"))}</p></div>` : "";
	// Basis-Elemente, die gegen dieses Monster stark bzw. schwach sind
	const vs = BASE_MASKS.map((e) => [e, elementMultiplier(e, m.initial_type)]);
	const weak = vs.filter(([, x]) => x > 1), strong = vs.filter(([, x]) => x < 1);
	const vsList = (list) => list.length ? list.map(([e, x]) => `${chip(e)} <span class="small muted">×${fmtNum(x)}</span>`).join(" ") : `<span class="muted">${ui("none")}</span>`;
	const group = (title, items) => `<div class="skill-group"><h4>${title}</h4>${items.length ? `<ul class="skill-cards">${items.join("")}</ul>` : `<span class="muted">${ui("none")}</span>`}</div>`;
	const ms = Object.entries(m.milestone_egg_skills || {});
	const bs = Object.entries(m.bounty_egg_skills || {});
	return `<div class="dlg-head">
		<h2 id="mon-dialog-title">${esc(monName(m.name))}</h2>
		${chip(m.initial_type)} <span class="tag" style="${RARITY_STYLE[m.rarity] || ""}">${esc(rarityName(m.rarity))}</span> ${starterTag(m)}

			<div style="min-width:0">
				<dl class="kv" style="margin-top:0">
					<dt>${ui("bst")}</dt><dd>${(m.stats || []).join(" – ")}</dd>

}

function openMonDialog(name) {
	const m = DATA.mons.find((x) => x.name === name);
	const dlg = document.getElementById("mon-dialog");
	if (!m) { state.openMon = null; if (dlg.open) dlg.close(); return; }
	state.openMon = name;
	dlg.innerHTML = renderMonDetail(m);
	if (!dlg.open) dlg.showModal();
	dlg.scrollTop = 0;
}

function renderMonsters() {
	const bountyByKey = Object.fromEntries(DATA.bounties.map((b) => [b.key, b]));
	const msByKey = Object.fromEntries(DATA.milestones.map((m) => [m.key, m]));
	const rarities = Object.keys(DATA.enums.MON_RARITY || {}).filter((r) => DATA.mons.some((m) => m.rarity === r));
	const types = [...new Set(DATA.mons.map((m) => m.initial_type))]
		.sort((a, b) => elementsIn(a).length - elementsIn(b).length || a - b);
	const cards = DATA.mons
		.filter((m) => state.monType === "all" || m.initial_type === Number(state.monType))
		.filter((m) => state.monRarity === "all" || m.rarity === state.monRarity)
		.filter((m) => state.monStarter === "all" || isStarter(m) === (state.monStarter === "starter"))
		.filter((m) => {
		const skills = [...(m.default_egg_skills || []), ...(m.unlockable_egg_skills || []),
			...Object.values(m.milestone_egg_skills || {}), ...Object.values(m.bounty_egg_skills || {})];
		return matches(m.name, monName(m.name), elementName(m.initial_type), rarityName(m.rarity), ...skills.map((s) => tr(s)));
	}).map((m) => {
		const list = (names, how) => names.length ? `<ul class="skill-list">${names.map((n, i) =>
			`<li>${skillLabel(n)}${how ? `<span class="how">· ${esc(how(i))}</span>` : ""}</li>`).join("")}</ul>` : `<span class="muted">${ui("none")}</span>`;
		const ms = Object.entries(m.milestone_egg_skills || {});
		const bs = Object.entries(m.bounty_egg_skills || {});
		const catchBase = DATA.catch.rarityBase?.[m.rarity];
		return `<article class="card clickable" data-mon="${esc(m.name)}" tabindex="0" role="button" aria-label="${esc(monName(m.name))}">
			<div class="row" style="align-items:flex-start">
				<img class="mon-img" src="${esc(res(m.image))}" alt="${esc(monName(m.name))}" loading="lazy" onerror="this.style.visibility='hidden'">
				<div style="min-width:0">
					<h3>${hl(monName(m.name))}</h3>
					<div class="row" style="margin-top:4px">${chip(m.initial_type)} <span class="tag" style="${RARITY_STYLE[m.rarity] || ""}">${esc(rarityName(m.rarity))}</span> ${starterTag(m)}</div>
					<dl class="kv">
						<dt>${ui("bst")}</dt><dd>${(m.stats || []).join(" – ")}</dd>
						<dt>${ui("maxUpgrades")}</dt><dd>${m.max_upgrades ?? ui("none")}</dd>
						${catchBase != null ? `<dt>${ui("catchBase")}</dt><dd title="${esc(ui("catchHint"))}">${pct(catchBase)}</dd>` : ""}
					</dl>
				</div>
			</div>
			${statProfile(m)}
			<div class="skill-group"><h4>${ui("defaultSkills")}</h4>${list(m.default_egg_skills || [])}</div>
			<div class="skill-group"><h4>${ui("unlockable")}</h4>${list(m.unlockable_egg_skills || [])}</div>
			<div class="skill-group"><h4>${ui("milestone")}</h4>${list(ms.map(([, s]) => s), (i) => {
				const def = msByKey[ms[i][0]];
				return def ? `${def.count}× ${tr("MILESTONE_STAT_" + def.stat.toUpperCase())}` : ms[i][0];
			})}</div>
			<div class="skill-group"><h4>${ui("bounty")}</h4>${list(bs.map(([, s]) => s), (i) => {
				const def = bountyByKey[bs[i][0]];
				return def ? tr(def.label, { mon: monName(def.mon) }) + ` (${ui("depth")} ${def.min_depth + 1}+)` : bs[i][0];
			})}</div>
		</article>`;
	});
	const filters = `<div class="filters">
		<select id="f-mon-type" aria-label="${ui("element")}">
			<option value="all">${ui("element")}: ${ui("all")}</option>
			${types.map((t) => `<option value="${t}" ${String(t) === state.monType ? "selected" : ""}>${esc(elementName(t))}</option>`).join("")}
		</select>
		<select id="f-mon-rarity" aria-label="${ui("rarity")}">
			<option value="all">${ui("rarity")}: ${ui("all")}</option>
			${rarities.map((r) => `<option value="${r}" ${r === state.monRarity ? "selected" : ""}>${esc(rarityName(r))}</option>`).join("")}
		</select>
		<select id="f-mon-starter" aria-label="${ui("starter")}">
			${[["all", `${ui("starter")}: ${ui("all")}`], ["starter", ui("onlyStarters")], ["other", ui("noStarters")]]
				.map(([v, l]) => `<option value="${v}" ${v === state.monStarter ? "selected" : ""}>${esc(l)}</option>`).join("")}
		</select>
		<span class="muted small">${cards.length} / ${DATA.mons.length} · ${esc(ui("clickHint"))}</span>
	</div>`;
	return header("monsters") + filters + (cards.length ? `<div class="grid">${cards.join("")}</div>` : `<div class="empty">${ui("noResults")}</div>`);
}

function renderSkills() {
	const cols = [
		{ key: "name", label: ui("name"), get: (s) => tr(s.name) },
		{ key: "nature", label: ui("element"), get: (s) => elementsIn(s.nature).length * 100 + s.nature },
		{ key: "tier", label: ui("tier"), get: (s) => s.tier || 1 },
		{ key: "value", label: ui("power"), get: (s) => s.value ?? s.damage ?? 0, num: true },
		{ key: "damage_type", label: ui("type"), get: (s) => dmgType(s) },
		{ key: "cost", label: ui("cost"), get: (s) => s.cost, num: true },
		{ key: "cooldown", label: ui("cd"), get: (s) => s.cooldown, num: true },
		{ key: "shop", label: ui("shop"), get: (s) => s.shop_cost?.min ?? 0, num: true },
		{ key: "list", label: ui("source"), get: (s) => DATA.skillLists.indexOf(s.list) },
	];
	const { key, dir } = state.skillSort;
	const col = cols.find((c) => c.key === key) || cols[2];
	const rows = DATA.skills
		.filter((s) => state.skillElement === "all" || (s.nature & Number(state.skillElement)))
		.filter((s) => state.skillList === "all" || s.list === state.skillList)
		.filter((s) => matches(tr(s.name), s.name, elementName(s.nature), skillDesc(s), ui("lists")[s.list]))
		.sort((a, b) => {
			const x = col.get(a), y = col.get(b);
			const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), state.lang);
			return (dir === "asc" ? c : -c) || (a.tier || 1) - (b.tier || 1) || (a.value ?? 0) - (b.value ?? 0);
		});
	// Arten, die den Skill als Start-Skill, Ei-Attacke, Meilenstein oder Kopfgeld haben
	const usable = (s) => DATA.mons.filter((m) => [...(m.default_egg_skills || []), ...(m.unlockable_egg_skills || []),
		...Object.values(m.milestone_egg_skills || {}), ...Object.values(m.bounty_egg_skills || {})].includes(s.name)).map((m) => monName(m.name));
	const filters = `<div class="filters">
		<select id="f-element" aria-label="${ui("element")}">
			<option value="all">${ui("element")}: ${ui("all")}</option>
			${BASE_MASKS.map((e) => `<option value="${e}" ${String(e) === state.skillElement ? "selected" : ""}>${esc(elementName(e))}</option>`).join("")}
		</select>
		<select id="f-list" aria-label="${ui("source")}">
			<option value="all">${ui("source")}: ${ui("all")}</option>
			${DATA.skillLists.map((l) => `<option value="${l}" ${l === state.skillList ? "selected" : ""}>${esc(ui("lists")[l] || l)}</option>`).join("")}
		</select>
		<span class="muted small">${rows.length} / ${DATA.skills.length} · ${ui("maxSkills")}: ${DATA.maxSkills ?? "?"}</span>
	</div>`;
	const table = `<div class="table-wrap"><table>
		<thead><tr>${cols.map((c) => `<th class="sortable ${c.num ? "num" : ""}" data-sort="${c.key}" ${c.key === key ? `data-dir="${dir}"` : ""}>${esc(c.label)}</th>`).join("")}
			<th>${ui("desc")}</th><th>${ui("usableBy")}</th></tr></thead>
		<tbody>${rows.map((s) => `<tr>
			<td><b>${hl(tr(s.name))}</b><br><code class="small">${hl(s.name)}</code></td>
			<td>${chip(s.nature)}</td>
			<td class="tier" title="${ui("weight")}: ${fmtNum(skillWeight(s))}">${tierStars(s.tier)}</td>
			<td class="num">${fmtNum(s.value ?? s.damage ?? 0)}${standardBonusPerStep(s) ? `<br><span class="small muted" title="${esc(ui("rarityBonusHint"))}">+${fmtNum(standardBonusPerStep(s))} ${esc(ui("perRarity"))}</span>` : ""}</td>
			<td>${dmgType(s)}</td>
			<td class="num">${s.cost ?? ""}</td>
			<td class="num">${s.cooldown ?? ""}</td>
			<td class="num">${s.shop_cost ? `${s.shop_cost.min}–${s.shop_cost.max}` : ""}</td>
			<td><span class="tag">${esc(ui("lists")[s.list] || s.list)}</span><br><span class="small muted">${esc(skillSources(s))}</span></td>
			<td class="wrap">${hl(skillDesc(s))}</td>
			<td class="wrap small">${esc(usable(s).join(", ") || ui("none"))}</td>
		</tr>`).join("")}</tbody></table></div>`;
	const weights = `<p class="small muted" style="margin-top:12px">${ui("tierWeights")}: ${Object.entries(DATA.tierWeights || {}).map(([t, w]) => `${ui("tier")} ${t} = ${w}`).join(" · ")}
		(+${Math.round((DATA.depthTierBonus || 0) * 100)} % / ${ui("depth")} / ${ui("tier")})</p>`;
	return header("skills") + filters + (rows.length ? table : `<div class="empty">${ui("noResults")}</div>`) + weights;
}

function renderElements() {
	const strong = DATA.elements.strongAgainst;
	// Kreis ab dem ersten Element ablaufen
	const cycle = [];
	let cur = BASE_MASKS[0];
	while (cur && !cycle.includes(cur)) { cycle.push(cur); cur = strong[cur]; }
	const cycleHtml = `<div class="card wide"><h3>${ui("strongVs")}</h3><div class="cycle" style="margin-top:8px">${
		cycle.map(chip).join(" <span class='muted'>→</span> ")} <span class="muted">→</span> ${chip(cycle[0])}</div>
		<p class="small muted" style="margin:8px 0 0">+1 → ×${1 + DATA.elements.elementBonus}, +2 → ×${1 + 2 * DATA.elements.elementBonus} · −1 → ×${1 - DATA.elements.elementBonus}, −2 → ×${Math.pow(1 - DATA.elements.elementBonus, 2)}</p></div>`;

	const combos = DATA.elements.combos
		.filter((c) => matches(tr(c.label), c.label, ...elementsIn(c.mask).map(elementName)))
		.sort((a, b) => elementsIn(a.mask).length - elementsIn(b.mask).length || a.mask - b.mask);
	const comboHtml = combos.map((c) => {
		const skills = DATA.skills.filter((s) => s.nature === c.mask);
		const mons = DATA.mons.filter((m) => m.initial_type === c.mask);
		return `<article class="card"><div class="row">
			<div class="swatch" style="background:${esc(c.color)}"></div>
			<div><h3>${hl(tr(c.label))}</h3><div class="small muted">${elementsIn(c.mask).length > 1 ? `${ui("components")}: ${elementsIn(c.mask).map(elementName).join(" + ")}` : esc(c.color)}</div></div>
		</div>
		<dl class="kv">
			<dt>${ui("effect")}</dt><dd>${elementEffectText(c.mask) ? hl(elementEffectText(c.mask)) : ui("noEffect")}</dd>
			<dt>${ui("skills")}</dt><dd>${skills.length ? skills.map((s) => esc(tr(s.name))).join(", ") : ui("none")}</dd>
			<dt>${ui("monsters")}</dt><dd>${mons.length ? mons.map((m) => esc(monName(m.name))).join(", ") : ui("none")}</dd>
		</dl></article>`;
	}).join("");

	const axis = (state.matrixAll ? DATA.elements.combos.map((c) => c.mask) : BASE_MASKS)
		.slice().sort((a, b) => elementsIn(a).length - elementsIn(b).length || a - b);
	const cell = (a, d) => {
		const m = elementMultiplier(a, d);
		const s = Math.min(Math.abs(elementScore(a, d)), 4);
		const cls = m > 1 ? "m-up" : m < 1 ? "m-down" : "m-eq";
		return `<td class="${cls}" style="--s:${s}" title="${esc(elementName(a))} → ${esc(elementName(d))}">×${fmtNum(m)}</td>`;
	};
	const matrix = `<div class="card wide">
		<div class="row"><h3>${ui("matchups")}</h3><div class="spacer"></div>
			<div class="seg" id="matrix-mode">
				<button data-all="0" aria-pressed="${!state.matrixAll}">${ui("onlyBase")}</button>
				<button data-all="1" aria-pressed="${state.matrixAll}">${ui("allCombos")}</button>
			</div></div>
		<div class="table-wrap" style="margin-top:10px;box-shadow:none"><table class="matrix">
			<thead><tr><th class="rowh small">${ui("attacker")}</th>${axis.map((d) => `<th>${chip(d)}</th>`).join("")}</tr></thead>
			<tbody>${axis.map((a) => `<tr><th class="rowh">${chip(a)}</th>${axis.map((d) => cell(a, d)).join("")}</tr>`).join("")}</tbody>
		</table></div></div>`;

	// Übersicht der Element-Effekte (ElementEffects), nach Anzahl der Grundelemente gruppiert
	const effectRows = DATA.elements.combos
		.filter((c) => elementEffectText(c.mask))
		.filter((c) => matches(tr(c.label), c.label, elementEffectText(c.mask), ...elementsIn(c.mask).map(elementName)))
		.sort((a, b) => elementsIn(a.mask).length - elementsIn(b.mask).length || a.mask - b.mask);
	const effectTable = `<h3 style="margin:24px 0 10px">${ui("elementEffects")}</h3>
		<p class="small muted" style="margin:0 0 10px">${ui("elementEffectsHint")}</p>
		${effectRows.length ? `<div class="table-wrap"><table>
			<thead><tr><th>${ui("element")}</th><th>${ui("components")}</th><th>${ui("effect")}</th></tr></thead>
			<tbody>${effectRows.map((c) => `<tr><td>${chip(c.mask)}</td>
				<td class="small muted">${elementsIn(c.mask).map(elementName).join(" + ")}</td>
				<td>${hl(elementEffectText(c.mask))}</td></tr>`).join("")}</tbody>
		</table></div>` : `<div class="empty">${ui("noResults")}</div>`}`;

	return header("elements") + `<div class="grid">${cycleHtml}${matrix}</div>
		${effectTable}
		<h3 style="margin:24px 0 10px">${ui("combos")}</h3>
		${combos.length ? `<div class="grid">${comboHtml}</div>` : `<div class="empty">${ui("noResults")}</div>`}`;
}

		.map(([key, g]) => `<article class="card"><div class="row">

function renderUnlocks() {
	const ms = DATA.milestones.filter((m) => matches(m.key, tr(m.hint), ...DATA.mons.map((mon) => tr(mon.milestone_egg_skills?.[m.key]))));
	const bs = DATA.bounties.filter((b) => matches(b.key, tr(b.label, { mon: monName(b.mon) }), tr(b.hint), ...DATA.mons.map((mon) => tr(mon.bounty_egg_skills?.[b.key]))));
	const rewards = (field, key) => DATA.mons.filter((m) => m[field]?.[key])
		.map((m) => `<li>${esc(monName(m.name))}: ${skillLabel(m[field][key])}</li>`).join("");
	const msHtml = ms.map((m) => `<article class="card">
		<h3>${esc(m.count)}× ${esc(tr("MILESTONE_STAT_" + m.stat.toUpperCase()))}</h3>
		<p class="small muted" style="margin:4px 0 0">${hl(tr(m.hint))}</p>
		<div class="skill-group"><h4>${ui("reward")}</h4><ul class="skill-list">${rewards("milestone_egg_skills", m.key) || ui("none")}</ul></div>
	</article>`).join("");
	const bsHtml = bs.map((b) => `<article class="card">
		<h3>${hl(tr(b.label, { mon: monName(b.mon) }))}</h3>
		<dl class="kv">
			<dt>${ui("appearsFrom")}</dt><dd>${b.min_depth + 1}</dd>
			<dt>${ui("levelBonus")}</dt><dd>+${b.level_bonus}</dd>
		</dl>
		<p class="small muted" style="margin:8px 0 0">${hl(tr(b.hint))}</p>
		<div class="skill-group"><h4>${ui("reward")}</h4><ul class="skill-list">${rewards("bounty_egg_skills", b.key) || ui("none")}</ul></div>
	</article>`).join("");
	return header("unlocks") +
		`<h3 style="margin:0 0 10px">${ui("milestone")}</h3>${msHtml ? `<div class="grid">${msHtml}</div>` : `<div class="empty">${ui("noResults")}</div>`}
		<h3 style="margin:24px 0 4px">${ui("bounty")}</h3>
		<p class="small muted" style="margin:0 0 10px">${ui("bountyChance")}: ${pct(DATA.bountyChance || 0)}</p>
		${bsHtml ? `<div class="grid">${bsHtml}</div>` : `<div class="empty">${ui("noResults")}</div>`}`;
}

function renderMap() {
	const settings = Object.entries(DATA.map.settings);
	// Spalten aus den Daten, damit neue Feldtypen automatisch auftauchen
	const keys = [...new Set(settings.flatMap(([, s]) => Object.keys(s)))];
	const scalar = keys.filter((k) => settings.every(([, s]) => !Array.isArray(s[k])));
	const lists = keys.filter((k) => !scalar.includes(k));
	const nodeLabel = { bosses: "BOSS", tresures: "TREASURE", shops: "SHOP", trainers: "TRAINER", jailer: "JAILER", gems: "GEM", camps: "CAMP", events: "EVENT" };
	const label = (k) => ({ paths: ui("paths"), special_nodes: ui("special"), lines: ui("lines") }[k] ||
		(nodeLabel[k] ? tr("MAP_NODE_" + nodeLabel[k]) : k));
	const biomeTier = (i) => i === settings.length - 1 ? 4 : Math.min(1 + Math.round(i * 3 / Math.max(settings.length - 1, 1)), 3);
	const table = `<div class="table-wrap"><table>
		<thead><tr><th>${ui("depth")}</th><th>${ui("element")}</th>${scalar.map((k) => `<th class="num">${esc(label(k))}</th>`).join("")}${lists.map((k) => `<th>${esc(label(k))}</th>`).join("")}</tr></thead>
		<tbody>${settings.map(([d, s], i) => `<tr>
			<td><b>${Number(d) + 1}</b></td>
			<td class="small">${biomeTier(i)} ${biomeTier(i) === 1 ? ui("element") : ui("elements")}</td>
			${scalar.map((k) => `<td class="num">${s[k] ?? ""}</td>`).join("")}
			${lists.map((k) => `<td>${(s[k] || []).length ? s[k].join(", ") : `<span class="muted">${ui("none")}</span>`}</td>`).join("")}
		</tr>`).join("")}</tbody></table></div>`;
	const nodeTypes = Object.keys(DATA.enums.PATH_TYPE).filter((k) => tr("MAP_NODE_" + k + "_DESC") !== "MAP_NODE_" + k + "_DESC" && matches(tr("MAP_NODE_" + k), tr("MAP_NODE_" + k + "_DESC")));
	const nodeHtml = nodeTypes.map((k) => `<article class="card"><h3>${hl(tr("MAP_NODE_" + k))}</h3><p class="small" style="margin:6px 0 0">${hl(tr("MAP_NODE_" + k + "_DESC"))}</p></article>`).join("");
	return header("map") + table + `<p class="small muted" style="margin-top:12px">${ui("nodeRows")} · max_rows ${DATA.map.maxRows ?? "?"} · max_cols ${DATA.map.maxCols ?? "?"}</p>` +
		(nodeHtml ? `<h3 style="margin:24px 0 10px">${ui("nodeTypes")}</h3><div class="grid">${nodeHtml}</div>` : "");
}

// ─────────────────────────
// Rahmen

function renderChrome() {
	document.documentElement.lang = state.lang;
	document.getElementById("search").placeholder = ui("search");
	document.getElementById("lang").innerHTML = DATA.langs.map((l) =>
		`<button data-lang="${l}" aria-pressed="${l === state.lang}">${l.toUpperCase()}</button>`).join("");
	document.getElementById("tabs").innerHTML = Object.entries(SECTIONS).map(([key, s]) =>
		`<button role="tab" data-tab="${key}" aria-selected="${key === state.tab}">${esc(ui(key))}<span class="count">${s.count()}</span></button>`).join("");
	const date = new Date(DATA.generatedAt);
	document.getElementById("footer").innerHTML = `${ui("generated")}: ${date.toLocaleString(state.lang)}${DATA.git ? ` · ${ui("commit")} <code>${esc(DATA.git)}</code>` : ""} · <code>node tools/wiki/build_wiki.js</code>`;
}

function render() {
	if (!SECTIONS[state.tab]) state.tab = "monsters";
	renderChrome();
	const warn = DATA.warnings?.length ? `<div class="warn"><b>${ui("warnings")}</b><ul>${DATA.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : "";
	document.getElementById("main").innerHTML = warn + `<section>${SECTIONS[state.tab].render()}</section>`;
	// offene Detailansicht z. B. nach Sprachwechsel neu aufbauen
	if (state.openMon) openMonDialog(state.openMon);
}

function applyTheme(theme) {
	if (theme === "auto") delete document.documentElement.dataset.theme;
	else document.documentElement.dataset.theme = theme;
	document.querySelectorAll("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
	localSet("wiki.theme", theme);
}

const monDialog = document.getElementById("mon-dialog");
// Klick auf den abgedunkelten Rand schließt die Detailansicht
monDialog.addEventListener("click", (e) => { if (e.target === monDialog || e.target.closest("[data-close]")) monDialog.close(); });
monDialog.addEventListener("close", () => { state.openMon = null; });
document.addEventListener("keydown", (e) => {
	const card = e.target.closest?.("[data-mon]");
	if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openMonDialog(card.dataset.mon); }
});
document.addEventListener("click", (e) => {
	if (monDialog.contains(e.target)) return;
	const card = e.target.closest("[data-mon]");
	if (card) { openMonDialog(card.dataset.mon); return; }
	const t = e.target.closest("button, th.sortable");
	if (!t) return;
	if (t.dataset.tab) {
		state.tab = t.dataset.tab;
		localSet("wiki.tab", state.tab);
		history.replaceState(null, "", "#" + state.tab);
		render();
		window.scrollTo({ top: 0 });
	} else if (t.dataset.lang) {
		state.lang = t.dataset.lang;
		localSet("wiki.lang", state.lang);
		render();
	} else if (t.dataset.theme) {
		applyTheme(t.dataset.theme);
	} else if (t.dataset.sort) {
		const s = state.skillSort;
		state.skillSort = { key: t.dataset.sort, dir: s.key === t.dataset.sort && s.dir === "asc" ? "desc" : "asc" };
		render();
	} else if (t.dataset.all !== undefined) {
		state.matrixAll = t.dataset.all === "1";
		render();
	}
});
document.addEventListener("change", (e) => {
	if (e.target.id === "f-element") state.skillElement = e.target.value;
	else if (e.target.id === "f-list") state.skillList = e.target.value;
	else if (e.target.id === "f-mon-type") state.monType = e.target.value;
	else if (e.target.id === "f-mon-rarity") state.monRarity = e.target.value;
	else if (e.target.id === "f-mon-starter") state.monStarter = e.target.value;
	else return;
	render();
});
document.getElementById("search").addEventListener("input", (e) => {
	state.query = e.target.value.trim();
	const pos = e.target.selectionStart;
	render();
	e.target.focus();
	e.target.setSelectionRange(pos, pos);
});
window.addEventListener("hashchange", () => { state.tab = location.hash.slice(1); render(); });

applyTheme(localGet("wiki.theme") || "auto");
render();
</script>
</body>
</html>
